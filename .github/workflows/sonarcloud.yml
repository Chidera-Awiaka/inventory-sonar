name: SonarQube Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to full commit SHAs (tag in comment) so a moved tag cannot inject code.
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0   # full history improves new-code detection

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # Hash-locked requirements + wheels only: no unpinned resolution, no setup.py execution.
      - name: Install dependencies
        run: pip install --require-hashes --only-binary :all: -r requirements.txt

      - name: Run tests with coverage
        run: pytest --cov=src --cov-report=xml:coverage.xml --cov-report=term

      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
